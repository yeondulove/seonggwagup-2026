<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<style>
  :root{--bg:#0f1420;--card:#1a2234;--card2:#222c42;--line:#2e3a55;--text:#e8edf6;--muted:#9aa7c0;--accent:#5b8cff;--accent2:#3fd29b;--warn:#ffb454;--bad:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(160deg,#0f1420,#141c2e);color:var(--text);font-family:"맑은 고딕","Malgun Gothic",system-ui,sans-serif;min-height:100vh;padding:28px 14px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:21px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .login{max-width:430px;margin:36px auto 0;text-align:center}
  .field{display:flex;gap:10px;margin-top:18px}
  input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:13px 14px;font-size:16px;outline:none}
  input:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:0 20px;font-size:15px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted);padding:10px 16px}
  .err{color:var(--bad);font-size:13.5px;margin-top:14px;min-height:18px}
  .hidden{display:none}
  .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
  .teamname{font-size:20px;font-weight:800}
  .leader{color:var(--muted);font-size:13px;margin-top:2px}
  .fund{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 18px;text-align:right}
  .fund .lbl{color:var(--muted);font-size:12px}.fund .val{font-size:20px;font-weight:800;color:var(--accent2)}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14.5px}
  th{color:var(--muted);font-weight:600;font-size:12.5px}
  td.num,th.num{text-align:right}
  select{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:14px}
  select:disabled{opacity:.85;appearance:none;-webkit-appearance:none;background:transparent;border-color:transparent;font-weight:700;padding-left:0}
  .role{color:var(--muted);font-size:12.5px}
  .totrow td{border-top:2px solid var(--line);border-bottom:none;font-weight:800;padding-top:14px}
  .ok{color:var(--accent2)}.mis{color:var(--warn)}
  .legend{color:var(--muted);font-size:12px;margin-top:10px}
  .statusbar{margin-top:14px;font-size:13.5px;min-height:20px}.statusbar .locked{color:var(--accent2);font-weight:700}
  .pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
  .pill.y{background:rgba(63,210,155,.15);color:var(--accent2)}
  .pill.n{background:rgba(255,180,84,.15);color:var(--warn)}
  .spin{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>성과급 배분 · 자동집계</h1>
  <div class="sub">가중치비례 방식 · 본인 팀만 조회 · 확정 시 자동 집계</div>

  <!-- 로그인 -->
  <div id="loginView" class="card login">
    <h2 style="margin:0 0 8px">본인 확인</h2>
    <p style="color:var(--muted);font-size:13.5px;line-height:1.6;margin:0">전달받은 <b>비밀번호</b>를 입력하세요.<br>(팀장: 팀 비밀번호 · 인사팀/부대표: 관리자 비밀번호)</p>
    <div class="field">
      <input id="pw" type="password" placeholder="비밀번호" autocomplete="off">
      <button id="goBtn" onclick="doLogin()">조회</button>
    </div>
    <div id="loginErr" class="err"></div>
    <div id="loginSpin" class="spin hidden">확인 중…</div>
  </div>

  <!-- 팀장 화면 -->
  <div id="teamView" class="card hidden">
    <div class="topbar">
      <div><div class="teamname" id="tName"></div><div class="leader" id="tLeader"></div></div>
      <div class="fund"><div class="lbl">팀 재원</div><div class="val" id="tFund"></div></div>
    </div>
    <table>
      <thead><tr><th>이름</th><th>직책</th><th>등급</th><th class="num">가중치</th><th class="num">예상 성과급</th><th class="num">비중</th></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot><tr class="totrow"><td colspan="3">합계</td><td class="num" id="sw"></td><td class="num" id="sp"></td><td class="num">100%</td></tr></tfoot>
    </table>
    <div class="legend">인턴은 50만원 고정 지급 · 나머지 재원을 비인턴이 가중치 비례로 배분 (S:4 A:3 B:2 C:1 D:0)</div>
    <div class="note" id="note" style="margin-top:10px"></div>
    <div class="statusbar" id="statusBar"></div>
    <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
      <button id="confirmBtn" onclick="doConfirm()">✓ 성과등급 확정(제출)</button>
      <button class="btn-ghost hidden" id="editBtn" onclick="unlock()">수정하기</button>
      <button class="btn-ghost" onclick="window.print()">인쇄 / PDF 저장</button>
      <button class="btn-ghost" onclick="logout()">← 로그아웃</button>
    </div>
  </div>

  <!-- 관리자 대시보드 -->
  <div id="adminView" class="card hidden">
    <div class="topbar">
      <div class="teamname">관리자 · 집계 현황</div>
      <button class="btn-ghost" onclick="logout()">← 로그아웃</button>
    </div>
    <div class="sub" id="adminSummary"></div>
    <table>
      <thead><tr><th>팀</th><th>팀장</th><th class="num">재원</th><th>확정 여부</th><th>확정 시각</th></tr></thead>
      <tbody id="adminRows"></tbody>
    </table>
    <div class="legend">상세 내역(개인별 성과급)은 구글 시트의 <b>‘결과’</b> 탭에서 실시간으로 확인·내보내기할 수 있습니다.</div>
    <div style="margin-top:16px"><button class="btn-ghost" onclick="loadDashboard(ADMIN_PW)">새로고침</button></div>
  </div>
</div>

<script>
  var WEIGHT = {S:4, A:3, B:2, C:1, D:0};
  var FIXED_INTERN = 500000; // 인턴 고정 지급액
  var team = null, locked = false, ADMIN_PW = '';
  function won(n){ return Number(n).toLocaleString('ko-KR') + '원'; }
  function $(id){ return document.getElementById(id); }

  /* ---- 로그인: 팀 비번 우선, 실패 시 관리자 비번 시도 ---- */
  function doLogin(){
    var pw = $('pw').value;
    $('loginErr').textContent = '';
    if(!pw){ $('loginErr').textContent = '비밀번호를 입력하세요.'; return; }
    setBusy(true);
    google.script.run
      .withSuccessHandler(function(res){
        if(res && res.ok){ setBusy(false); openTeam(res, pw); return; }
        // 팀 실패 → 관리자 시도
        google.script.run
          .withSuccessHandler(function(d){
            setBusy(false);
            if(d && d.ok){ ADMIN_PW = pw; openAdmin(d); }
            else { $('loginErr').textContent = '일치하는 팀 또는 관리자 비밀번호가 없습니다.'; }
          })
          .withFailureHandler(function(e){ setBusy(false); $('loginErr').textContent = '오류: ' + e.message; })
          .getDashboard(pw);
      })
      .withFailureHandler(function(e){ setBusy(false); $('loginErr').textContent = '오류: ' + e.message; })
      .authTeam(pw);
  }
  function setBusy(b){ $('goBtn').disabled = b; $('loginSpin').classList.toggle('hidden', !b); }

  /* ---- 팀장 화면 ---- */
  function openTeam(res, pw){
    team = res.team; team.pw = pw; locked = !!res.confirmed;
    $('loginView').classList.add('hidden');
    $('adminView').classList.add('hidden');
    $('teamView').classList.remove('hidden');
    $('tName').textContent = team.name;
    $('tLeader').textContent = team.leader ? ('팀장: ' + team.leader) : '';
    $('tFund').textContent = won(team.fund);
    team._confirmedAt = res.confirmedAt || '';
    render();
  }

  function computePay(members, fund){
    var n = members.length;
    var pay = members.map(function(){ return 0; });
    var internTotal = 0;
    for(var i=0;i<n;i++){ if(members[i].role === '인턴'){ pay[i] = FIXED_INTERN; internTotal += FIXED_INTERN; } }
    var remaining = fund - internTotal;
    var idx = [], w = [];
    for(var j=0;j<n;j++){ if(members[j].role !== '인턴'){ idx.push(j); w.push(WEIGHT[members[j].grade]); } }
    var sumW = w.reduce(function(a,b){ return a+b; }, 0);
    if(sumW > 0 && remaining > 0){
      var raw = w.map(function(x){ return x / sumW * remaining; });
      var fl = raw.map(Math.floor);
      var rem = remaining - fl.reduce(function(a,b){ return a+b; }, 0);
      var ord = raw.map(function(r,k){ return { k:k, f:r-Math.floor(r) }; }).sort(function(a,b){ return b.f-a.f; });
      for(var t=0;t<ord.length && rem>0;t++){ fl[ord[t].k]+=1; rem--; }
      for(var q=0;q<idx.length;q++){ pay[idx[q]] = fl[q]; }
    }
    return { pay:pay, sumW:sumW, remaining:remaining, internTotal:internTotal };
  }

  function render(){
    var res = computePay(team.members, team.fund);
    var pay = res.pay, sumW = res.sumW;
    var tb = $('rows'); tb.innerHTML = '';
    var gs = ['S','A','B','C','D'];
    team.members.forEach(function(m, i){
      var tr = document.createElement('tr');
      var opts = gs.map(function(g){ return "<option value='"+g+"' "+(g===m.grade?'selected':'')+">"+g+"</option>"; }).join('');
      var pct = team.fund>0 ? (pay[i]/team.fund*100) : 0;
      var wcell = (m.role === '인턴') ? '고정' : WEIGHT[m.grade];
      tr.innerHTML = "<td>"+m.name+"</td><td class='role'>"+m.role+"</td>"+
        "<td><select "+(locked?'disabled':'')+" data-i='"+i+"'>"+opts+"</select></td>"+
        "<td class='num'>"+wcell+"</td><td class='num'>"+won(pay[i])+"</td><td class='num'>"+pct.toFixed(1)+"%</td>";
      tb.appendChild(tr);
    });
    Array.prototype.forEach.call(tb.querySelectorAll('select'), function(s){
      s.addEventListener('change', function(e){ if(locked) return; team.members[+e.target.dataset.i].grade = e.target.value; render(); });
    });
    var sp = pay.reduce(function(a,b){ return a+b; }, 0);
    $('sw').textContent = sumW; $('sp').textContent = won(sp);
    var note = $('note');
    if(res.remaining<0) note.innerHTML = "<span class='mis'>⚠ 인턴 고정액이 재원을 초과합니다.</span>";
    else if(sp===team.fund) note.innerHTML = "<span class='ok'>✔ 합계가 팀 재원과 정확히 일치합니다.</span>";
    else note.innerHTML = "<span class='mis'>차액 "+won(team.fund-sp)+"</span>";
    updateStatus();
  }

  function updateStatus(busyMsg){
    var sb = $('statusBar'), cb = $('confirmBtn'), eb = $('editBtn');
    if(busyMsg){ sb.innerHTML = "<span class='spin'>"+busyMsg+"</span>"; return; }
    if(locked){
      cb.classList.add('hidden'); eb.classList.remove('hidden');
      sb.innerHTML = "<span class='locked'>🔒 제출 완료</span> · "+(team._confirmedAt||'')+" — 인사팀에 자동 집계되었습니다. 수정하려면 ‘수정하기’.";
    } else {
      cb.classList.remove('hidden'); eb.classList.add('hidden');
      sb.innerHTML = "<span style='color:var(--muted)'>등급 입력을 마치면 ‘성과등급 확정(제출)’을 누르세요. 제출 시 인사팀에 자동 전송됩니다.</span>";
    }
  }

  function unlock(){ locked = false; render(); }

  function doConfirm(){
    var res = computePay(team.members, team.fund);
    var tot = res.pay.reduce(function(a,b){ return a+b; }, 0);
    if(res.remaining < 0){ alert('인턴 고정액이 재원을 초과합니다. 확인이 필요합니다.'); return; }
    if(tot === 0){ alert('배분액이 0원입니다. 등급을 확인하세요.'); return; }
    if(!confirm(team.name + '의 성과등급을 확정·제출합니다. 인사팀에 자동 집계되며, 이후에도 다시 수정·재제출할 수 있습니다. 진행할까요?')) return;
    $('confirmBtn').disabled = true;
    updateStatus('제출 중…');
    var grades = team.members.map(function(m){ return m.grade; });
    google.script.run
      .withSuccessHandler(function(r){
        $('confirmBtn').disabled = false;
        if(r && r.ok){ locked = true; team._confirmedAt = r.ts; render(); }
        else { updateStatus(); alert('제출 실패: ' + (r && r.msg ? r.msg : '알 수 없는 오류')); }
      })
      .withFailureHandler(function(e){ $('confirmBtn').disabled = false; updateStatus(); alert('오류: ' + e.message); })
      .submitResult(team.pw, grades);
  }

  function logout(){
    team = null; locked = false; ADMIN_PW = '';
    $('teamView').classList.add('hidden'); $('adminView').classList.add('hidden');
    $('loginView').classList.remove('hidden');
    $('pw').value = ''; $('loginErr').textContent = '';
  }

  /* ---- 관리자 ---- */
  function openAdmin(d){
    $('loginView').classList.add('hidden'); $('teamView').classList.add('hidden');
    $('adminView').classList.remove('hidden');
    renderDashboard(d);
  }
  function loadDashboard(pw){
    google.script.run.withSuccessHandler(function(d){ if(d && d.ok) renderDashboard(d); }).getDashboard(pw);
  }
  function renderDashboard(d){
    $('adminSummary').textContent = '확정 ' + d.confirmedCount + ' / ' + d.totalTeams + '개 팀 · 전체 재원 ' + won(d.totalFund);
    var tb = $('adminRows'); tb.innerHTML = '';
    d.rows.forEach(function(r){
      var tr = document.createElement('tr');
      tr.innerHTML = "<td>"+r.team+"</td><td class='role'>"+r.leader+"</td><td class='num'>"+won(r.fund)+"</td>"+
        "<td>"+(r.confirmed ? "<span class='pill y'>확정</span>" : "<span class='pill n'>미확정</span>")+"</td>"+
        "<td class='role'>"+(r.time||'-')+"</td>";
      tb.appendChild(tr);
    });
  }

  document.getElementById('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
